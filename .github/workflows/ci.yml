name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim-version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhymond/setup-neovim@v1
        with:
          neovim-version: ${{ matrix.nvim-version }}

      - name: Install plenary.nvim
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim

      - name: Install telescope.nvim
        run: |
          git clone --depth 1 https://github.com/nvim-telescope/telescope.nvim ~/.local/share/nvim/site/pack/vendor/start/telescope.nvim

      - name: Run tests
        run: |
          nvim --headless -u NONE -c "set rtp+=." -c "packadd plenary.nvim" -c "PlenaryBustedDirectory tests/ { minimal_init = 'tests/minimal_init.lua' }"
